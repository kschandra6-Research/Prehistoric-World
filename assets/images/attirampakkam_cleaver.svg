          <path d="M -70,-130 L 70,-130 L 60,-115 L -60,-115 Z" fill="#f59e0b" opacity="0.8"/>
          <path d="M -70,-130 Q -10,0 -60,110" fill="none" stroke="#451a03" stroke-width="2"/>
          <path d="M 70,-130 Q 10,0 60,110" fill="none" stroke="#451a03" stroke-width="2"/>
        </g>
        

  <g transform="translate(40, 40)">
