    <text x="16" y="24" fill="#d97706" font-size="10" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="1">ARCHAEOLOGICAL REFERENCE SPECIMEN</text>
    <text x="16" y="44" fill="#ffffff" font-size="15" font-family="'Cinzel', serif" font-weight="700">Attirampakkam Madras Acheule...</text>
    <text x="16" y="59" fill="#94a3b8" font-size="11" font-family="'Inter', sans-serif">Locality: Tamil Nadu, India &#8226; Age: 1.51 Ma</text>
